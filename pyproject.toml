[project]
name = "kc-mcp"
version = "0.1.0"
description = "Knowledge Center MCP-style tools over teaching lesson notes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
kc-mcp-server = "kc_mcp.mcp_server:main"
kc-mcp = "kc_mcp.cli:main"


[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
